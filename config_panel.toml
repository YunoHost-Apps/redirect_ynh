version = "1.0"

[main]
name.en = "Configuration panel"
name.fr = "Panneau de configuration"
services = ["nginx"]


[main.proxy]
name.fr = "Redirection"
name.en = "Redirect"

[main.proxy.proxy_pass]
ask.fr = "adresse proxy_pass"
ask.en = "proxy_pass to"
type = "url"
bind = "null"
optional = false

[main.integration]
name.en = "Embedding"
name.fr = "Intégration"
[main.integration.allowed_urls]
ask.en = "Allow embedding from (URLs separated by spaces)"
ask.fr = "Liste des adresses web autorisées à intégrer cette application séparées par un espace"
type = "string"
bind = "null"

