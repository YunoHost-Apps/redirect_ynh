#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "redirect"
name = "Redirect"
description.en = "Create a redirection or a proxy to another path"
description.fr = "Créer une redirection ou un proxy vers un autre emplacement"

version = "2.2~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-or-later"
website = "https://en.wikipedia.org/wiki/Reverse_proxy"

[integration]
yunohost = ">= 11.2.30"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/redirect"
    help = "Be careful when using this app in reverse-proxy mode: the target may require to be installed at the root of a domain (or subdomain), meaning the path is just '/'!"

    [install.redirect_type]
    ask.en = "Redirect type"
    ask.fr = "Type de redirection"
    type = "select"
    choices.redirect = "Explicit redirection (HTTP 302). Redirect people to a different page."
    choices.reverseproxy = "Reverse-proxy (nginx proxy_pass). Expose an app, typically something that you manually installed (with or without Docker) locally or an another machine."
    choices.passthrough = "Reverse-proxy passthrough (nginx proxy_pass which not manage ssl).the remote server manage the ssl to have end to end encryption"
    default = "redirect"

    [install.target_protocol]
    ask.en = "Are server(s) have http or https access ?"
    ask.fr = "Les serveur(s) est(sont) il(s) accessible(s) en https ou en http ?"
    type = "select"
    choices = ["http", "https"]
    default = "http"    
    
    [install.target_servers]
    ask.en = "Target server(s)"
    ask.fr = "Serveur(s) destination"
    default = "server 127.0.0.1;"
    help.en = "For a simpleredirect, only one server like (host.domain.tld(:port) or ip(:port)). \nFor a reverse proxy or passthrough, serveur should be specified as 'server host:port;' inline or one per line. Read the manual for more options : https://nginx.org/en/docs/http/ngx_http_upstream_module.html"
    help.fr = "Pour une redirection simple , un seul serveur (host.domain.tld(:port) or ip(:port)). \nPour un proxy inversé ou transparent, les serveurs devont être spécifiés sous la forme 'server host:port;' en ligne ou un par ligne.. Lire la documentation pour plus d'option : https://nginx.org/en/docs/http/ngx_http_upstream_module.html"
    type = "text"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    # Meh we gotta keep this otherwise migrations from the v1 era will fail
    # because they assume a system user resource existed in v1 and will want to
    # delete it if not present anymore in the manifest ...
    [resources.system_user]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false
